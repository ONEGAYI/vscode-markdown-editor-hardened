name: Build & Verify Release

on:
  push:
    tags:
      - "*"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install media-src deps
        working-directory: ./media-src
        run: pnpm install --frozen-lockfile
      - name: Install tests deps
        working-directory: ./tests
        run: pnpm install --frozen-lockfile
      - name: Compile extension host (tsc emits out/ for integration tests)
        run: pnpm exec tsc -p ./
      - name: Build webview bundle
        working-directory: ./media-src
        run: pnpm build
      - name: Run security PoCs + integration smoke (release gate)
        run: pnpm test
      - name: Package vsix
        run: pnpm exec vsce package --no-dependencies || npx --yes @vscode/vsce package --no-dependencies
      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-hardened-vsix
          path: "*.vsix"

